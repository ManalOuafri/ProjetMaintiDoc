services:
  # PostgreSQL 16 avec l'extension pgvector (base vectorielle de MaintiDoc)
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: maintidoc-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-maintidoc}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-maintidoc}
      POSTGRES_DB: ${PG_DATABASE:-maintidoc}
    ports:
      - "${PG_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-maintidoc} -d ${PG_DATABASE:-maintidoc}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
